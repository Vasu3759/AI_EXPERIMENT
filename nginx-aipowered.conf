server {
    listen 80;
    server_name aipowered.chalksnboard.com;

    # The root directory should point to the 'out' folder in your cloned repository
    # CHANGE THIS to the absolute path where you cloned the repo on your EC2 instance
    # Example: /home/ec2-user/AI_EXPERIMEN_cnblandingpage/out
    root /home/ec2-user/AI_EXPERIMEN_cnblandingpage/out;

    index index.html index.htm;

    location / {
        # Next.js static export fallback routing
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Cache static assets for better performance
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
